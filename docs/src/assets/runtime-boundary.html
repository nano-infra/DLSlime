<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>DLSlime 3.0 — Layered communication runtime</title>
  <style>
    :root { color-scheme: light; font: 14px/1.5 system-ui, -apple-system, sans-serif; color: #23364c; background: #f8fafc; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 20px; }
    main { max-width: 1360px; margin: auto; }
    header { display: flex; align-items: center; gap: 12px; margin: 0 8px 12px; }
    header img { width: 36px; height: 36px; }
    h1 { margin: 0; font-size: 20px; letter-spacing: -.4px; }
    header p { margin: 0; color: #68798c; font-size: 12px; }
    figure { margin: 0; overflow-x: auto; }
    svg { display: block; width: 100%; min-width: 760px; height: auto; }
    .group rect { fill: #eff4fa; stroke: #cbd6e4; stroke-width: 1.4; }
    .group text { font-size: 15px; font-weight: 650; fill: #445c76; }
    .abstractions rect { fill: #eff9f5; stroke: #bfdccf; }
    .control rect { fill: #fff3e0; stroke: #ef6c00; stroke-width: 2; }
    .control text { fill: #92551c; }
    .execution rect { fill: #f1effb; stroke: #cec6e7; }
    .node rect { fill: #fff; stroke: #bbcbdc; stroke-width: 1.4; }
    .node text { font-size: 16px; font-weight: 600; fill: #253c54; }
    .node .subtitle { font-size: 13px; font-weight: 400; fill: #667b91; }
    .agent rect { fill: #dcefe5; stroke: #5d9d7f; stroke-width: 1.8; }
    .control-node rect { stroke: #d6ad79; fill: #fffdf9; }
    .registry rect { fill: #ffe0b2; stroke: #ef6c00; stroke-width: 2; }
    .topology rect { fill: #eaf4fc; stroke: #8eabc4; }
    .engine rect { fill: #e6e1f6; stroke: #a395c7; }
    .observability rect { fill: #f3f0f9; stroke: #a498bc; stroke-dasharray: 6 4; }
    .edge { fill: none; stroke: #5c7087; stroke-width: 1.7; stroke-linejoin: round; }
    .observation { stroke: #9387ae; stroke-dasharray: 6 5; stroke-width: 1.5; }
    figcaption { margin: 10px 8px 0; display: flex; flex-wrap: wrap; gap: 10px 28px; font-size: 12px; color: #64758a; }
    .sample { display: inline-block; width: 26px; margin-right: 8px; vertical-align: middle; border-top: 2px solid #5c7087; }
    .sample.dashed { border-top: 2px dashed #9387ae; }
  </style>
</head>
<body>
<main>
  <header>
    <img src="nanoengine-logo.svg" alt="NanoEngine logo" width="36" height="36">
    <div><h1>DLSlime 3.0</h1><p>A layered communication runtime</p></div>
  </header>
  <figure>

<title id="diagram-title">DLSlime layered communication runtime</title>
<desc id="diagram-description">The original roadmap graph: five applications target Agent; Agent exposes Memory, Operation, Future, Stream / Event and connects to PeerAgent. PeerAgent and dlslime-ctrl communicate bidirectionally. dlslime-ctrl supplies identity, then discovery, then Topology. Memory, Operation, Future, Stream / Event and Topology directly feed Transfer Engine. Transfer Engine drives execution substrates. Dashed edges from Control Plane, Topology, Transfer Engine, Future and execution substrates lead to Observability.</desc>

<marker id="observe-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#9387ae"/></marker>
</defs>
